# The HTTP port used by user-service.
server.port=8081

# PostgreSQL connection settings.
# Values come from environment variables so secrets are not stored in Git.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA settings.
# "update" lets Hibernate create/update the table structure during local development.
spring.jpa.hibernate.ddl-auto=update

# Shows SQL generated by JPA in the console during development.
spring.jpa.show-sql=true

# PostgreSQL-specific database settings.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Expose only the Prometheus metrics endpoint.
management.endpoints.web.exposure.include=prometheus
management.endpoint.prometheus.access=read-only
