# study-service listens on port 8082.
server.port=8082

# PostgreSQL connection.
# These values are supplied through environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Hibernate/JPA settings.
# During local development, Hibernate will create/update tables
# based on our @Entity classes.
spring.jpa.hibernate.ddl-auto=update

# Show generated SQL during local development.
spring.jpa.show-sql=true

# Use PostgreSQL as the JPA database dialect.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect