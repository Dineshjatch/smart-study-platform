apiVersion: batch/v1
kind: Job
metadata:
  name: k6-gateway-load-test
  namespace: smart-study
spec:
  backoffLimit: 0

  template:
    spec:
      restartPolicy: Never

      containers:
        - name: k6
          image: grafana/k6:latest

          command:
            - k6
            - run
            - /scripts/gateway-cluster-load-test.js

          env:
            - name: TEST_EMAIL
              valueFrom:
                secretKeyRef:
                  name: k6-test-credentials
                  key: email

            - name: TEST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k6-test-credentials
                  key: password

          volumeMounts:
            - name: k6-script
              mountPath: /scripts

      volumes:
        - name: k6-script
          configMap:
            name: k6-test-script