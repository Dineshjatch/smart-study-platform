apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: smart-study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: smart-study-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081

          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-study-config
                  key: USER_DB_URL

            - name: DB_USERNAME
              value: "postgres"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-postgres-secret
                  key: password

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-study-jwt-secret
                  key: jwt-secret

            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=UTC"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: smart-study
spec:
  type: ClusterIP
  selector:
    app: user-service
  ports:
    - port: 8081
      targetPort: 8081