apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: quiz-postgres-pvc
  namespace: smart-study
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quiz-postgres
  namespace: smart-study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: quiz-postgres
  template:
    metadata:
      labels:
        app: quiz-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: quiz_db

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: quiz-postgres-secret
                  key: password

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: quiz-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: quiz-postgres
  namespace: smart-study
spec:
  selector:
    app: quiz-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP