apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: smart-study
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: smart-study-api-gateway:k8s-v2
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080

          env:
            - name: USER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-study-config
                  key: USER_SERVICE_URL

            - name: STUDY_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-study-config
                  key: STUDY_SERVICE_URL

            - name: QUIZ_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: smart-study-config
                  key: QUIZ_SERVICE_URL

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: smart-study-jwt-secret
                  key: jwt-secret

            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=UTC"

          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: smart-study
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080