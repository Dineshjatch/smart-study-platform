apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: study-service-hpa
  namespace: smart-study
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: study-service

  minReplicas: 2
  maxReplicas: 2

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
